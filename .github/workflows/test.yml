name: Static and TOTP tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app.mjs
          node --check totp.mjs
          node --check vendor/qrcode.min.js
      - name: Verify official TOTP vectors and input handling
        run: node --test tests/*.test.mjs
